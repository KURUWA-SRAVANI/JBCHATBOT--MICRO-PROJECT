<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JBChatBot - Real Time Research Project, CSE, JBREC</title>
    <!-- Bootstrap CSS -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        /*#chat-container {
            max-width: 600px;
            margin: 0 auto;
        }*/

        .chat-box {
            height: 64vh;
            scrollbar-width: none;
            overflow-y: auto;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            background-image: url(asset/hhh.jpeg);
            background-size: 750px;
        }

        .chat-message {
            margin-bottom: 10px;
           
        }

        .chat-message.user {
            text-align: right;
            color: gold;
        }

        .chat-message.bot {
            text-align: left;
            color: White;
        }

        #user-input {
            border: none;
            border-radius: 8px;
            padding: 10px;
            width: auto;
            margin-top: 3px;
        }

        #send-button {
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }

        #send-button:hover {
            background-color: #0056b3;
        }

        .logo {
                width: 7em;
    height: auto;
    margin-bottom: 95%;
        }
        .container {
        padding: 30px;
        border-radius: 5px;
        background-color: #ccffea;
            background-image: url(asset/ccc.jpg);
    background-size: contain;
    }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" >
</head>
<body>
    <div class="container" id="chat-container">
        <div class="row">
            <!-- Left side with college logo, project title, and team members' names -->
            <div class="col-md-6 text-center" style="
    /* background: #0b0d336e; */
    color: white;
">
<div class="row">
<div class="col-md-6 text-left"><img src="asset/JBREC-Logo.jpg" alt="College Logo" class="logo">
</div>
<div class="col-md-6 text-right"><h1 class="" style="color: #00deff;/* margin-top: auto; *//* background: aliceblue; */"><span style="
    background-color: #0c1149d1;
">JBChatBot</span></h1></div>
</div>

                <h2 style="
    background: #0b0d336e;
">Real Time Research Project, CSE</h2>
                <p><b>Developed By:</b></p>

                <p><b>K.Sravani - 22J21A0599</b><br><p></p>
            </div>

            <!-- Right side with chatbot -->
            <div class="col-md-6">
                <div class="chat-box" id="chat-box"></div>
                <div class="input-group">
                    <input type="text" id="user-input" class="form-control" placeholder="Type your message...">
                    <div class="input-group-append">
                        <button id="send-button" class="btn btn-primary"><i class="fa fa-paper-plane" aria-hidden="true"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#send-button').click(function () {
                var userInput = $('#user-input').val().trim();
                if (userInput !== '') {
                    appendMessage('user', userInput);
                    fetch('https://api-inference.huggingface.co/models/facebook/blenderbot-400M-distill', {
                        method: 'POST',
                      headers: {
    'Authorization': 'Bearer ',
    'Content-Type': 'application/json'
},

                        body: JSON.stringify({ inputs: userInput })
                    })
                    .then(response => response.json())
                    .then(data => {
                        const generatedText = data[0]?.generated_text ? data[0].generated_text : "I'm sorry, I don't understand.";
                        appendMessage('bot', generatedText);
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        appendMessage('bot', 'Sorry, I am having trouble understanding you right now.');
                    });
                }
            });
        });

        function appendMessage(sender, message) {
            const chatBox = $('#chat-box');
            const messageElement = $('<div></div>').addClass('chat-message').addClass(sender).text(message);
            chatBox.append(messageElement);
            chatBox.scrollTop(chatBox[0].scrollHeight);
            if (sender === 'user') {
                $('#user-input').val('');
              }
        }
    </script>
</body>
</html>
